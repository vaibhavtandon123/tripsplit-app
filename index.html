<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TripSplit">
<meta name="theme-color" content="#4FB596">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#4FB596; --mint-d:#3C9C7F; --orange:#F2672E;
  --bg:#FFFFFF; --card:#FFFFFF; --ink:#222222; --sub:#717171;
  --line:#DDDDDD; --soft:#F7F7F7; --shadow:0 2px 8px rgba(0,0,0,.08);
  --green:#2Fae7f; --red:#E0603A;
}
:root[data-theme="dark"]{--bg:#191C20;--card:#23272C;--ink:#F2F4F6;--sub:#9BA1A8;--line:#32373D;--soft:#2B3036;--shadow:0 1px 3px rgba(0,0,0,.35);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#191C20;--card:#23272C;--ink:#F2F4F6;--sub:#9BA1A8;--line:#32373D;--soft:#2B3036;--shadow:0 1px 3px rgba(0,0,0,.35);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Roboto,sans-serif;touch-action:pan-y;-webkit-font-smoothing:antialiased;
  -webkit-font-smoothing:antialiased;}
body{position:fixed;inset:0;display:flex;flex-direction:row;justify-content:center;}
#frame{position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);}
@media(min-width:760px){body{background:#0d0e10;}#frame{max-width:460px;box-shadow:0 0 70px rgba(0,0,0,.5);}}
a{color:inherit;}
.app{flex:1;display:flex;flex-direction:column;min-height:0;}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 20px 100px;touch-action:pan-y;animation:scrFwd .24s cubic-bezier(.22,.61,.36,1);}
@keyframes scrFwd{from{opacity:0;transform:translateX(16px);}to{opacity:1;transform:none;}}
@keyframes scrBack{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:none;}}
@media (prefers-reduced-motion:reduce){.screen{animation:none;}}
.hidden{display:none !important;}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;}
.top h1{font-size:21px;font-weight:800;margin:0;flex:1;letter-spacing:-.3px;}
.iconbtn{width:38px;height:38px;border-radius:50%;border:none;background:var(--soft);color:var(--ink);font-size:17px;display:flex;align-items:center;justify-content:center;}
.newbtn{background:linear-gradient(135deg,var(--mint),var(--mint-d));color:#fff;border:none;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;font-family:inherit;box-shadow:0 4px 12px rgba(79,181,150,.38);}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:0 0 auto;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .track{position:absolute;inset:0;background:var(--soft);border-radius:999px;transition:.2s;cursor:pointer;}
.switch .track:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .track{background:var(--mint);}
.switch input:checked + .track:before{transform:translateX(18px);}
.tkpill{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;}
.tkpill.up{background:rgba(79,181,150,.15);color:var(--mint-d,#2E8A70);}
.tkpill.done{background:var(--soft);color:var(--sub);}
.back{background:none;border:none;color:var(--mint);font-size:15px;font-weight:600;padding:0;}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:16px;font-size:16px;font-weight:700;font-family:inherit;background:var(--mint);color:#fff;box-shadow:var(--shadow);letter-spacing:.1px;}
.btn:active{transform:scale(.99);}
.btn.sec{background:var(--soft);color:var(--ink);}
.btn.out{background:none;border:1.5px solid var(--line);color:var(--ink);box-shadow:none;}
.btn.orange{background:var(--orange);}
.btn.danger{background:none;border:1.5px solid var(--orange);color:var(--orange);box-shadow:none;}
.btn.sm{padding:11px;font-size:14px;border-radius:11px;}
.row2{display:flex;gap:10px;}
.field{margin:12px 0;}
.field label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;font-weight:500;}
input,select,textarea{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:13px;font-size:16px;font-family:inherit;outline:none;}
textarea{min-height:60px;resize:vertical;}
input:focus,select:focus,textarea:focus{border-color:var(--mint);}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:48px;line-height:1.2;}
.row2{display:flex;gap:12px;}.row2 > *{flex:1;min-width:0;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;box-shadow:var(--shadow);}
.muted{color:var(--sub);font-size:13px;}
.tripcard{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:11px 0;box-shadow:var(--shadow);}
.tripcard .badge{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--mint),var(--mint-d));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:0 0 auto;background-size:cover;background-position:center;}
.tripcard .t{flex:1;min-width:0;}
.tripcard .t b{font-size:16px;}
.chev{color:var(--sub);font-size:20px;}
.lockpill{font-size:11px;background:var(--soft);color:var(--sub);border-radius:20px;padding:2px 8px;}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:70px;background:var(--card);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom);}

  PRESET_ORDER.forEach(function(k){var p=PRESETS[k];var bg=k==='auto'?'linear-gradient(135deg,#C9CED6,#8A9099)':p[0];
    h+='<div class="covsw'+(selected===k||(!selected&&k==='auto')?' on':'')+'" data-pre="'+k+'" style="background:'+bg+'"><span>'+p[1]+'</span></div>';});
  return h+'</div></div>';
}
function wireCoverPicker(getset){
  var pick=$('#covPick');if(!pick)return;
  Array.prototype.forEach.call(pick.children,function(sw){sw.onclick=function(){Array.prototype.forEach.call(pick.children,function(x){x.classList.remove('on');});sw.classList.add('on');getset(sw.getAttribute('data-pre'));};});
}
var MCOLORS=['#19B47E','#5B8DEF','#E8577B','#8E63E6','#F0975B','#2BB1C9','#E8A13A','#4FB596'];
function memberColor(id){var s=String(id||''),n=0;for(var i=0;i<s.length;i++)n=(n*31+s.charCodeAt(i))>>>0;return MCOLORS[n%MCOLORS.length];}
var SPLITMETA={equal:['🟰','Split equally','Pick who’s in. Everyone pays the same.'],custom:['🔢','Exact amounts','Type exactly how much each owes.'],percent:['％','By percentage','Enter a % split that’s fair.'],shares:['👨‍👩‍👧','By shares','Family of 3 → 3 shares · kid → ½ share.'],adjust:['➕➖','Equal + adjust','Split equal, then add extra for someone.']};

var CATWORDS=[['Food',['dinner','lunch','breakfast','food','restaurant','cafe','pizza','burger','meal','snack','khana','nashta','thali','dhaba','biryani','lassi','dessert','icecream','sweets','mithai']],['Train ticket',['train','irctc','railway','rail','tatkal','sleeper']],['Flight ticket',['flight','airport','airline','indigo','vistara','spicejet','air india','boarding pass','airfare']],['Travel',['taxi','cab','traveller','bike rental','scooter rental','uber','ola','auto','rickshaw','bus','metro','travel','ride','transport','toll','parking','ferry','boat ride']],['Stay',['hotel','stay','resort','hostel','room','airbnb','lodge','guesthouse','oyo','homestay','villa','cottage','check-in','checkin']],['Entry tickets',['entry','museum','monument','fort','palace','sightseeing','gate pass','entry fee','zoo','aquarium','theme park','water park']],['Fuel',['fuel','petrol','diesel','cng','gas station']],['Drinks',['drinks','beer','bar','coffee','tea','chai','juice','wine','cocktail','pub','soda','water bottle']],['Shopping',['shopping','shop','mall','clothes','souvenir','market','gift','store']],['Activities',['activity','trek','tour','adventure','boating','safari','rafting','zipline','spa','game']]];
function guessCat(desc){var s=(desc||'').toLowerCase();if(s.length<2)return '';for(var i=0;i<CATWORDS.length;i++){var w=CATWORDS[i][1];for(var j=0;j<w.length;j++){if(s.indexOf(w[j])>=0)return CATWORDS[i][0];}}return '';}
function sdate(iso){try{return new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short'});}catch(e){return'';}}
function sdt(iso){try{return new Date(iso).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function dayLabel(d){try{var t=new Date().toISOString().slice(0,10);return d===t?'Today':new Date(d).toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'});}catch(e){return d;}}
function todayStr(){return new Date().toISOString().slice(0,10);}

function call(fn,arg){return fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn:fn,arg:arg})}).then(function(r){return r.json();}).then(function(d){if(d&&Object.prototype.hasOwnProperty.call(d,'e'))throw d.e;return d?d.r:null;});}
function toast(msg){var t=$('#toast');t.innerHTML='';var n=el('<div class="toast">'+esc(msg)+'</div>');t.appendChild(n);setTimeout(function(){n.remove();},2800);}
function loading(on){var ex=document.getElementById('loaderOverlay');if(on){if(!ex){var d=el('<div id="loaderOverlay" style="position:absolute;inset:0;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;z-index:200"><div class="spin"></div></div>');(document.getElementById('frame')||document.body).appendChild(d);}}else{if(ex)ex.remove();}}
function closeModal(){$('#modal').innerHTML='';}

/* ---------- state + cache ---------- */
var S={token:localStorage.getItem('tet_token')||'',user:null,trip:null,data:null,tab:'trips'};
function saveToken(t){S.token=t;localStorage.setItem('tet_token',t);}
function logout(){S.token='';localStorage.removeItem('tet_token');S.user=null;renderAuth();}
function cacheGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function cacheSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function applyTheme(){var m=localStorage.getItem('tet_theme')||'light';if(m==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',m);}
applyTheme();

/* offline queue (adds) */
function cid(){return 'cid-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8);}
function queueGet(){try{return JSON.parse(localStorage.getItem('tet_queue')||'[]');}catch(e){return[];}}
function queueSet(q){try{localStorage.setItem('tet_queue',JSON.stringify(q));}catch(e){}}
function queueAdd(fn,arg){var q=queueGet();q.push({fn:fn,arg:arg});queueSet(q);}
var _flushing=false;
async function flushQueue(){if(_flushing)return;var q=queueGet();if(!q.length||!navigator.onLine)return;_flushing=true;var rest=[],ok=0;
  for(var i=0;i<q.length;i++){var it=q[i];var fn=it&&it.fn?it.fn:'api_addExpense';var arg=it&&it.fn?it.arg:it;
    try{await call(fn,arg);ok++;}catch(e){if(e instanceof TypeError||!navigator.onLine)rest.push(it);/* network: retry later. server-rejected: drop. */}}
  queueSet(rest);_flushing=false;
  if(ok){if(S.trip&&S.trip.tripId)refreshTrip(S.trip.tripId);if(!rest.length)toast('Synced '+ok+' change'+(ok>1?'s':''));}}
// Fire a mutating call in the background (non-blocking). On a lost connection, queue it to sync later (idempotent on the server).
function bgCall(fn,arg){return call(fn,arg).then(function(d){if(d&&d.trip){setData(d);if(S.trip&&d.trip&&S.trip.tripId===d.trip.tripId&&!(($('#modal')||{}).innerHTML))renderDashboard();}}).catch(function(e){if(e instanceof TypeError||!navigator.onLine){queueAdd(fn,arg);toast('Saved — will sync shortly');}else{toast(String(e));if(S.trip&&S.trip.tripId)refreshTrip(S.trip.tripId);}});}
window.addEventListener('online',function(){$('#offline').classList.add('hidden');flushQueue().then(function(){if(S.trip)refreshTrip(S.trip.tripId);});});
window.addEventListener('offline',function(){$('#offline').classList.remove('hidden');});
if(!navigator.onLine)$('#offline').classList.remove('hidden');

function hideSplash(){var s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(function(){if(s&&s.parentNode)s.parentNode.removeChild(s);},450);}}

/* ---------- boot ---------- */
(function boot(){
  if(!S.token){renderAuth();hideSplash();return;}
  var cu=cacheGet('tet_user');if(cu){S.user=cu;flushQueue();renderTrips();hideSplash();}
  else loading(true);
  call('api_me',S.token).then(function(u){S.user=u;cacheSet('tet_user',u);loading(false);flushQueue();if(!cu)renderTrips();hideSplash();})
    .catch(function(){loading(false);logout();hideSplash();});
})();
setTimeout(hideSplash,4000);

function showLogin(){
  $('#authbox').innerHTML='';
  $('#authbox').appendChild(el('<div>\
    <div class="field"><label>Username, email or phone</label><input id="lu" autocapitalize="none"></div>\
    <div class="field"><label>Password</label><input id="lp" type="password"></div>\
    <button class="btn" id="loginBtn">Log in</button>\
    <button class="btn out sm" id="forgotBtn" style="margin-top:10px">Forgot password?</button>\
    <p class="muted" style="text-align:center;margin-top:18px">New here? <a id="toSignup" style="color:var(--mint);font-weight:600">Create an account</a></p></div>'));
  $('#loginBtn').onclick=function(){var u=$('#lu').value,p=$('#lp').value;if(!u||!p)return toast('Enter username and password');loading(true);
    call('api_login',{username:u,password:p}).then(function(r){saveToken(r.token);S.user=r.user;cacheSet('tet_user',r.user);loading(false);renderTrips();}).catch(function(e){loading(false);toast(e);});};
  $('#toSignup').onclick=showSignup;$('#forgotBtn').onclick=showForgot;
}
function showSignup(){
  $('#authbox').innerHTML='';
  $('#authbox').appendChild(el('<div>\
    <div class="field"><label>Full name</label><input id="sn"></div>\
    <div class="field"><label>Username</label><input id="su" autocapitalize="none"></div>\
    <div class="field"><label>Email</label><input id="se" type="email" autocapitalize="none"></div>\
    <div class="field"><label>Mobile number</label><input id="sm" type="tel" placeholder="For WhatsApp settle-up"></div>\
    <div class="field"><label>Password</label><input id="sp" type="password"></div>\
    <div class="field"><label>Profile photo (optional)</label><input id="sphoto" type="file" accept="image/*"></div>\
    <button class="btn" id="signupBtn">Create account</button>\
    <p class="muted" style="text-align:center;margin-top:18px">Have an account? <a id="toLogin" style="color:var(--mint);font-weight:600">Log in</a></p></div>'));
  $('#signupBtn').onclick=function(){
    var data={fullName:$('#sn').value,username:$('#su').value,email:$('#se').value,mobile:$('#sm').value,password:$('#sp').value};
    if(!data.fullName||!data.username||!data.password)return toast('Name, username and password are required');
    var f=$('#sphoto').files[0];
    var go=function(photo){data.photo=photo||'';loading(true);call('api_signup',data).then(function(r){saveToken(r.token);S.user=r.user;cacheSet('tet_user',r.user);loading(false);renderTrips();}).catch(function(e){loading(false);toast(e);});};
    if(f)fileToResized(f,400).then(go);else go('');
  };
  $('#toLogin').onclick=showLogin;
}
function showForgot(){
  $('#authbox').innerHTML='';
  $('#authbox').appendChild(el('<div>\
    <div class="field"><label>Your email</label><input id="fe" type="email" autocapitalize="none"></div>\
    <button class="btn" id="sendCode">Send reset code</button><div id="resetArea"></div>\
    <p class="muted" style="text-align:center;margin-top:18px"><a id="toLogin2" style="color:var(--mint);font-weight:600">Back to log in</a></p></div>'));
  $('#toLogin2').onclick=showLogin;
  $('#sendCode').onclick=function(){var e=$('#fe').value;if(!e)return toast('Enter your email');loading(true);
    call('api_forgotPassword',{email:e}).then(function(r){loading(false);
      $('#resetArea').innerHTML='<div class="field"><label>Code from email</label><input id="rc"></div><div class="field"><label>New password</label><input id="np" type="password"></div><button class="btn" id="doReset">Set new password</button>';
      $('#doReset').onclick=function(){loading(true);call('api_resetPassword',{userId:r.userId,code:$('#rc').value,password:$('#np').value}).then(function(){loading(false);toast('Password changed. Please log in.');showLogin();}).catch(function(er){loading(false);toast(er);});};
    }).catch(function(er){loading(false);toast(er);});};
}
function fileToResized(file,max){return new Promise(function(res){var rd=new FileReader();rd.onload=function(){var img=new Image();img.onload=function(){var w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=w*sc;c.height=h*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.8));};img.src=rd.result;};rd.readAsDataURL(file);});}

 *  SHELL / TABS

function shell(active,bodyHtml,headerHtml){
  $('#app').innerHTML='';
  var wrap=el('<div class="app" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>');
  if(headerHtml)wrap.appendChild(el(headerHtml));
  var scr=el('<div class="screen"></div>');scr.innerHTML=bodyHtml;
  if(_backNav){scr.style.animation='scrBack .24s cubic-bezier(.22,.61,.36,1)';}
  _backNav=false;
  wrap.appendChild(scr);
  wrap.appendChild(tabBar(active));$('#app').appendChild(wrap);enablePull(scr);return scr;
}
/* ---- live refresh: swipe-down + when app returns to foreground ---- */
function refreshCurrent(cb){
  cb=cb||function(){};
  if(!S.token||($('#modal')&&$('#modal').innerHTML)){cb();return;}
  if(S.trip&&S.trip.tripId){
    call('api_tripData',{token:S.token,tripId:S.trip.tripId}).then(function(d){if(d&&d.trip){cacheSet('tet_trip_'+d.trip.tripId,d);if(S.trip&&S.trip.tripId===d.trip.tripId){S.trip=d.trip;S.data=d;if(document.querySelector('.balc2')&&!(($('#modal')||{}).innerHTML))renderDashboard();}}}).catch(function(){}).then(cb);
  } else if(S.tab==='trips'){
    call('api_myTrips',S.token).then(function(list){cacheSet('tet_trips',list);if($('#triplist')&&!S.trip)paintTrips(list);}).catch(function(){}).then(cb);
  } else if(S.tab==='friends'&&typeof renderFriends==='function'){ renderFriends();cb();
  } else if(S.tab==='activity'&&typeof renderActivityTab==='function'){ renderActivityTab();cb();
  } else cb();
}
function enablePull(scr){
  var startY=0,dy=0,pulling=false,busy=false;
  var ind=el('<div style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;pointer-events:none;transform:translateY(-44px);transition:transform .15s;z-index:50"><div class="spin" style="margin:7px"></div></div>');
  scr.style.position='relative';scr.appendChild(ind);
  scr.addEventListener('touchstart',function(e){ if(!busy&&scr.scrollTop<=0){startY=e.touches[0].clientY;pulling=true;dy=0;}else pulling=false; },{passive:true});
  scr.addEventListener('touchmove',function(e){ if(!pulling)return; dy=e.touches[0].clientY-startY; if(dy>0){var p=Math.min(dy*0.5,56);ind.style.transition='none';ind.style.transform='translateY('+(p-44)+'px)';} },{passive:true});
  scr.addEventListener('touchend',function(){ if(!pulling)return;pulling=false;ind.style.transition='transform .15s'; if(dy>70){busy=true;ind.style.transform='translateY(12px)';refreshCurrent(function(){busy=false;ind.style.transform='translateY(-44px)';});}else{ind.style.transform='translateY(-44px)';} dy=0; });
}
var _lastFg=0;
function onForeground(){ if(document.hidden||!S.token)return; var n=Date.now(); if(n-_lastFg<2500)return; _lastFg=n; flushQueue(); refreshCurrent(); }
document.addEventListener('visibilitychange',onForeground);
window.addEventListener('focus',onForeground);
window.addEventListener('pageshow',onForeground);
/* ---- in-app back (Android/iOS) so hardware/gesture back navigates inside the app, not exit ---- */
var _backNav=false;
function appGoBack(){
  var m=$('#modal'); if(m&&m.innerHTML&&m.innerHTML.trim()){ closeModal(); return true; }
  if(document.querySelector('.balc2')){ _backNav=true; renderTrips(); return true; }          // on a trip dashboard → trips list
  if(document.querySelector('.back')){ _backNav=true; renderDashboard(); return true; } // a sub-page → dashboard
  return false; // trips list / top level → allow exit
}
window.addEventListener('popstate',function(){ if(appGoBack()){ try{history.pushState({tet:1},'');}catch(e){} } });
try{history.pushState({tet:1},'');}catch(e){}

  var ic={trips:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h18M3 12h18M3 17h18"/></svg>',

function renderTrips(){
  S.trip=null;S.data=null;S.tab='trips';
  var head='<div class="top"><h1>Your trips</h1><button class="newbtn" id="newTop">＋ New</button></div>';
  var scr=shell('trips','<div id="triplist"></div>',head);
  $('#newTop').onclick=openStart;
  var cached=cacheGet('tet_trips');if(cached&&cached.length)paintTrips(cached);else $('#triplist').innerHTML=skelTrips();
  call('api_myTrips',S.token).then(function(list){cacheSet('tet_trips',list);if(S.tab==='trips')paintTrips(list);}).catch(function(e){if(!cached)$('#triplist').innerHTML='<div class="center">'+esc(e)+'</div>';});

function paintTrips(list){
  var box=$('#triplist');if(!box)return;
  if(!list.length){box.innerHTML='<div class="center"><div style="font-size:40px">🧳</div><div>No trips yet</div><button class="btn" id="n1" style="max-width:220px">Create a trip</button><button class="btn out sm" id="j1" style="max-width:220px">Join with a code</button></div>';$('#n1').onclick=openNewTrip;$('#j1').onclick=openJoinTrip;return;}
  var h='';list.forEach(function(t){
    var cf=coverFor(t.tripId||t.name,t.name,t.coverPreset);
    var cov=t.coverId?' data-cover="'+t.coverId+'"':'';
    var lock=t.locked?'<span class="tlock">🔒 Locked</span>':'';
    h+='<div class="tcard2" data-id="'+t.tripId+'">\
      <div class="tcover"'+cov+' style="background:'+cf.bg+'"><span class="covmotif">'+cf.motif+'</span>'+lock+'<div class="tname">'+esc(t.name)+'</div></div>\
      <div class="tfoot"><div class="tppl">👥 '+t.members+' '+(t.members==1?'person':'people')+'</div>\
      <div class="ttot"><span>Total spent</span><b>'+money0(t.total,t.currency)+'</b></div></div></div>';
  });
  h+='<div class="card" style="display:flex;gap:10px;padding:12px;margin-top:4px"><button class="btn sm" id="ntCreate" style="flex:1">✈️ New trip</button><button class="btn out sm" id="ntJoin" style="flex:1">🔗 Join</button></div>';
  box.innerHTML=h;
  Array.prototype.forEach.call(box.querySelectorAll('.tcard2'),function(c){c.onclick=function(){openTrip(c.getAttribute('data-id'));};});
  Array.prototype.forEach.call(box.querySelectorAll('[data-cover]'),function(c){c.style.backgroundImage='url(/img?id='+encodeURIComponent(c.getAttribute('data-cover'))+')';});
  if($('#ntCreate'))$('#ntCreate').onclick=openNewTrip;
  if($('#ntJoin'))$('#ntJoin').onclick=openJoinTrip;
}

function wireStationAC(input,box){
  function show(q){q=String(q||'').trim().toLowerCase();if(!q){box.style.display='none';box.innerHTML='';return;}
    var list=allStations(),pre=list.filter(function(s){return s.toLowerCase().indexOf(q)===0;}),mid=list.filter(function(s){return s.toLowerCase().indexOf(q)>0;});
    var res=pre.concat(mid).slice(0,8);
    if(!res.length){box.style.display='none';box.innerHTML='';return;}
    box.innerHTML=res.map(function(s){return '<div class="destrow" data-n="'+esc(s)+'" style="padding:11px 14px;border-bottom:1px solid var(--line)">🚉 '+esc(s)+'</div>';}).join('');
    box.style.display='block';
    Array.prototype.forEach.call(box.querySelectorAll('.destrow'),function(r){r.onmousedown=function(ev){ev.preventDefault();input.value=r.getAttribute('data-n');box.style.display='none';};});
  }
  input.oninput=function(e){show(e.target.value);};
  input.onblur=function(){setTimeout(function(){box.style.display='none';},180);};
}

function openNewTrip(){
  var catDefault=['Food','Travel','Train ticket','Flight ticket','Stay','Shopping','Entry tickets','Fuel','Other'];
  var now=new Date(),thisMonth=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2);
  sheetModal('Create a new trip',
    '<div class="field" style="position:relative;z-index:30"><label>Destination</label><input id="tdest" class="capsField" placeholder="Search a destination" autocomplete="off"><div id="destSug" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden;max-height:230px;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:40"></div></div>\
     <div class="field"><label>Month</label><input id="tmonth" type="month" value="'+thisMonth+'"></div>\
     <div class="field"><label>Trip name</label><input id="tname" placeholder="Trip name (auto-filled)"></div>\
     <div class="row2"><div class="field" style="flex:1"><label>Currency</label><select id="tc"><option value="INR">₹ INR</option><option value="USD">$ USD</option><option value="EUR">€ EUR</option><option value="GBP">£ GBP</option><option value="AED">AED</option></select></div>\
     <div class="field" style="flex:1"><label>Budget (optional)</label><input id="tb" type="number" inputmode="numeric" placeholder="0"></div></div>\
     ' + coverPicker('auto') + '<div class="field"><label>Cover photo (optional)</label><input id="tcover" type="file" accept="image/*"></div>\
     <button class="btn" id="createBtn">Create trip</button>',
    function(){
      var nameEdited=false, coverPreset='auto';
      wireCoverPicker(function(v){coverPreset=v;});
      function autoName(){if(nameEdited)return;var dst=$('#tdest').value.trim(),ml=monthLabel($('#tmonth').value);$('#tname').value=dst?(dst+(ml?' · '+ml:'')):'';}
      function showSug(q){var box=$('#destSug');q=q.trim().toLowerCase();if(!q){box.style.display='none';box.innerHTML='';return;}
        var st=DESTS.filter(function(d){return d.n.toLowerCase().indexOf(q)===0;}),co=DESTS.filter(function(d){return d.n.toLowerCase().indexOf(q)>0;});
        function rank(a,b){return (a.ind===b.ind)?0:(a.ind?-1:1);}
        var list=st.sort(rank).concat(co.sort(rank)).slice(0,8);
        if(!list.length){box.style.display='none';box.innerHTML='';return;}
        box.innerHTML=list.map(function(d){return '<div class="destrow" data-n="'+esc(d.n)+'" style="padding:11px 13px;border-bottom:1px solid var(--line);font-size:15px">'+esc(d.n)+(d.ind?'':' <span class="muted" style="font-size:12px">· International</span>')+'</div>';}).join('');
        box.style.display='block';
        Array.prototype.forEach.call(box.querySelectorAll('.destrow'),function(r){r.onclick=function(){$('#tdest').value=r.getAttribute('data-n');box.style.display='none';autoName();};});}
      $('#tdest').oninput=function(e){showSug(e.target.value);};
      $('#tdest').onblur=function(){setTimeout(autoName,180);};
      $('#tmonth').onchange=autoName;$('#tname').oninput=function(){nameEdited=true;};
      $('#createBtn').onclick=function(){
        var dest=$('#tdest').value.trim(),name=$('#tname').value.trim();if(!name&&dest){var ml0=monthLabel($('#tmonth').value);name=dest+(ml0?' · '+ml0:'');}if(!name)return toast('Enter a destination or trip name');
        var payload={token:S.token,name:name,destination:dest,monthLabel:monthLabel($('#tmonth').value),currency:$('#tc').value,budget:$('#tb').value,cats:catDefault,coverPreset:coverPreset};
        var f=$('#tcover').files[0];
        var go=function(cover){payload.cover=cover||'';loading(true);call('api_createTrip',payload).then(function(d){loading(false);closeModal();S.trip=d.trip;S.data=d;cacheSet('tet_trip_'+d.trip.tripId,d);renderDashboard();}).catch(function(e){loading(false);toast(e);});};
        if(f)fileToResized(f,900).then(go);else go('');
      };
    });
}

function openTrip(id){
  var c=cacheGet('tet_trip_'+id);
  if(c&&c.trip){S.trip=c.trip;S.data=c;renderDashboard(true);refreshTrip(id);}
  else{
    var head='<div class="top"><button class="back" id="bksk">‹ Trips</button><h1 style="font-size:17px;text-align:center">Loading…</h1><span style="width:38px"></span></div>';
    shell('trips',skelDashboard(),head);var bk=$('#bksk');if(bk)bk.onclick=renderTrips;
    call('api_tripData',{token:S.token,tripId:id}).then(function(d){if(!d||!d.trip){toast('Could not load this trip — please try again');renderTrips();return;}S.trip=d.trip;S.data=d;cacheSet('tet_trip_'+id,d);renderDashboard();}).catch(function(e){toast(e);renderTrips();});
  }
}
function refreshTrip(id){
  call('api_tripData',{token:S.token,tripId:id}).then(function(d){if(!d||!d.trip)return;cacheSet('tet_trip_'+id,d);if(S.trip&&S.trip.tripId===id){S.trip=d.trip;S.data=d;if(S.tab==='trips'&&!$('#modal').innerHTML)renderDashboard();}}).catch(function(){});
}

function buildDonut(byCat,total,cur){
  var pal=['#4FB596','#F2672E','#8656CD','#3A8DDE','#E8B33A','#E0603A','#2FAE7F','#9AA0A6'];
  var items=Object.keys(byCat).map(function(k){return {k:k,v:byCat[k]};}).sort(function(a,b){return b.v-a.v;});
  if(!items.length||total<=0)return '<div class="card" style="text-align:center;color:var(--sub);padding:24px 16px">No spending yet</div>';
  var cx=86,cy=86,r=78,ir=63,a=-Math.PI/2;
  function pt(rr,ang){return (cx+rr*Math.cos(ang))+' '+(cy+rr*Math.sin(ang));}
  var paths='';
  items.forEach(function(it,i){var f=it.v/total,a1=a+f*2*Math.PI,g=0.025,s=a+g/2,e=a1-g/2,lg=(e-s)>Math.PI?1:0,col=pal[i%pal.length];
    paths+='<path d="M '+pt(r,s)+' A '+r+' '+r+' 0 '+lg+' 1 '+pt(r,e)+' L '+pt(ir,e)+' A '+ir+' '+ir+' 0 '+lg+' 0 '+pt(ir,s)+' Z" fill="'+col+'"/>'; a=a1;});
  var svg='<svg viewBox="0 0 172 172" style="display:block;width:clamp(82px,27vw,136px);height:auto">'+paths+'<circle cx="86" cy="86" r="'+(ir-1)+'" fill="var(--card)"/><text x="86" y="82" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)">'+money0(total,cur)+'</text><text x="86" y="99" text-anchor="middle" font-size="9" letter-spacing="1.2" fill="var(--sub)">TOTAL</text></svg>';
  var leg='<div style="flex:1;min-width:0">';
  items.forEach(function(it,i){var col=pal[i%pal.length],pct=Math.round(it.v/total*100);
    leg+='<div style="display:flex;align-items:center;gap:9px;padding:3px 0">\
        <span style="width:9px;height:9px;border-radius:3px;flex:0 0 auto;background:'+col+'"></span>\
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px">'+esc(it.k)+'</span>\
        <b style="flex:0 0 auto;font-size:14px;white-space:nowrap">'+money0(it.v,cur)+'</b>\
        <span style="flex:0 0 auto;width:32px;text-align:right;color:var(--sub);font-size:12px;font-weight:600">'+pct+'%</span>\
    </div>';
  });
  leg+='</div>';
  return '<div class="card" style="padding:16px 14px;display:flex;align-items:center;gap:12px"><div style="flex:0 0 auto">'+svg+'</div>'+leg+'</div>';
}

function fixRound(split,chosen,amt){var sum=0;chosen.forEach(function(m){sum+=split[m.memberId];});var diff=Math.round((amt-sum)*100)/100;if(diff&&chosen.length)split[chosen[0].memberId]=Math.round((split[chosen[0].memberId]+diff)*100)/100;}

function shareOf(e){
  var keys=Object.keys(e.split||{}),out={};if(!keys.length)return out;
  if(e.splitType==='equal'){var weights={},sum=0,memById={};S.data.members.forEach(function(m){memById[m.memberId]=m;});keys.forEach(function(k){var ov=Number(e.split[k]),w;if(ov===0||ov===0.5||ov===1)w=ov;else{var m=memById[k]||{};w=m.isKid?(m.kidShare==='half'?0.5:m.kidShare==='none'?0:1):1;}weights[k]=w;sum+=w;});if(sum<=0){keys.forEach(function(k){out[k]=0;});return out;}keys.forEach(function(k){out[k]=e.amount*weights[k]/sum;});}
  else if(e.splitType==='percent')keys.forEach(function(k){out[k]=e.amount*Number(e.split[k])/100;});
  else keys.forEach(function(k){out[k]=Number(e.split[k]);});
  return out;
}

function timeAgo(iso){
  if(!iso)return '';var t=new Date(iso).getTime();if(isNaN(t))return '';
  var s=Math.floor((Date.now()-t)/1000);
  if(s<60)return 'just now';var m=Math.floor(s/60);if(m<60)return m+' min ago';
  var h=Math.floor(m/60);if(h<24)return h+' hr ago';var dd=Math.floor(h/24);return dd+(dd===1?' day ago':' days ago');
}

function showTicketConfirm(parsed,editId){
  var d=S.data,members=d.members,cur=d.trip.currency;
  function payOptsFor(sel){return members.map(function(m){return '<option value="'+m.memberId+'"'+(m.memberId===sel?' selected':'')+'>'+esc(m.name)+'</option>';}).join('');}
  var CLS=[['','Class (optional)'],['SL','Sleeper (SL)'],['3A','AC 3 Tier (3A)'],['2A','AC 2 Tier (2A)'],['1A','AC First (1A)'],['CC','Chair Car (CC)'],['2S','Second Sitting (2S)'],['3E','AC 3 Economy (3E)'],['FC','First Class (FC)']];
  function isoDate(s){s=String(s||'');return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:'';}
  var html='<p class="muted">Put the total fare and tick who travelled — it splits equally among them. Kids pay too unless you mark them Free.</p>';

    });
    var anyMatch=Object.keys(matched).length>0;
    var trav=tk._travelled;
    var rows=members.map(function(m){
      var checked = trav ? (trav.indexOf(m.memberId)>=0) : (anyMatch ? !!matched[m.memberId] : true);
      var px=(tk.passengers||[]).filter(function(p){return (p.name||'').toLowerCase().trim()===(m.name||'').toLowerCase().trim();})[0]||{};

        <div style="display:flex;align-items:center;gap:10px"><input type="checkbox" data-on="'+m.memberId+'"'+(checked?' checked':'')+' style="flex:0 0 auto;width:20px;height:20px"><span style="flex:1;min-width:0;font-weight:600;font-size:14px">'+esc(m.name)+'</span>'+(m.isKid?'<label class="muted" style="font-size:12px;display:flex;align-items:center;gap:5px;flex:0 0 auto"><input type="checkbox" data-free="'+m.memberId+'"> Free</label>':'')+'</div>\
        <div data-cs="'+m.memberId+'" style="display:'+(checked?'flex':'none')+';gap:8px;margin:7px 0 2px 30px"><input data-coach="'+m.memberId+'" placeholder="Coach" value="'+esc(px.coach||'')+'" style="flex:1"><input data-seat="'+m.memberId+'" placeholder="Seat" value="'+esc(px.seat||'')+'" style="flex:1"></div></div>';
    }).join('');
    var clsOpts=CLS.map(function(c){return '<option value="'+c[0]+'"'+((tk.cls||'')===c[0]?' selected':'')+'>'+c[1]+'</option>';}).join('');
    if(tk.cls && !CLS.some(function(c){return c[0]===tk.cls;}))clsOpts='<option value="'+esc(tk.cls)+'" selected>'+esc(tk.cls)+'</option>'+clsOpts;
    var modeV=(tk.mode||'train').toLowerCase();
    var sugStyle='display:none;position:absolute;top:100%;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:4px;max-height:220px;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:40';
    var fields;
    if(modeV==='flight'){
      fields='<div class="row2"><div class="field" style="flex:1"><label>Airline</label><input data-f="airline" class="capsField" placeholder="e.g. IndiGo" value="'+esc(tk.airline||'')+'"></div>\
      <div class="field" style="flex:1"><label>Flight no.</label><input data-f="flightNo" placeholder="e.g. 6E 234" value="'+esc(tk.flightNo||'')+'"></div></div>\
      <div class="row2"><div class="field" style="flex:1"><label>From</label><input data-f="from" class="capsField" placeholder="e.g. Delhi (DEL)" value="'+esc(tk.from||'')+'"></div>\
      <div class="field" style="flex:1"><label>To</label><input data-f="to" class="capsField" placeholder="e.g. Goa (GOI)" value="'+esc(tk.to||'')+'"></div></div>\
      <div class="row2"><div class="field" style="flex:1"><label>Journey date</label><input data-f="date" type="date" value="'+isoDate(tk.date)+'"></div>\
      <div class="field" style="flex:1"><label>PNR / Ref</label><input data-f="pnr" value="'+esc(tk.pnr||'')+'"></div></div>';
    } else {
      fields='<div class="row2"><div class="field" style="flex:1;position:relative;z-index:20"><label>From station</label><input data-f="from" class="capsField" autocomplete="off" placeholder="Type station" value="'+esc(tk.from||'')+'"><div class="stSug" id="sugFrom'+ti+'" style="'+sugStyle+'"></div></div>\
      <div class="field" style="flex:1;position:relative;z-index:20"><label>To station</label><input data-f="to" class="capsField" autocomplete="off" placeholder="Type station" value="'+esc(tk.to||'')+'"><div class="stSug" id="sugTo'+ti+'" style="'+sugStyle+'"></div></div></div>\
      <div class="row2"><div class="field" style="flex:1"><label>Train number</label><input data-f="trainNo" inputmode="numeric" placeholder="e.g. 12834" value="'+esc(tk.trainNo||'')+'"></div>\
      <div class="field" style="flex:1"><label>Journey date</label><input data-f="date" type="date" value="'+isoDate(tk.date)+'"></div></div>\
      <div class="row2"><div class="field" style="flex:1"><label>Class</label><select data-f="cls">'+clsOpts+'</select></div>\
      <div class="field" style="flex:1"><label>PNR / Ref</label><input data-f="pnr" value="'+esc(tk.pnr||'')+'"></div></div>';
    }

      <div class="field"><label>Who paid (booked)</label><select data-f="payer">'+payOptsFor(tk.payerId||'')+'</select></div>'+
      (modeV==='flight'?'':'<div class="field"><label>Attach ticket PDF (optional)</label><input data-f="pdf" type="file" accept="application/pdf"></div>')+'\
      <label class="muted" style="display:block;margin-bottom:4px">Who travelled (tick) — add seat details</label><div class="paxOn">'+rows+'</div>\
      <div class="perInfo muted" style="margin:8px 2px"></div>\
      <input type="hidden" data-f="fileId" value="'+esc(tk.fileId||'')+'"></div>';
  });
  html+='<button class="btn" id="tkSave">'+(editId?'Save changes':'Save tickets')+'</button>';
  sheetModal(editId?'Edit ticket':'Confirm tickets',html,function(){
    function refresh(ti){
      var cardEl=document.querySelector('[data-ti="'+ti+'"]');
      var fare=Number(cardEl.querySelector('[data-f="fare"]').value)||0;
      var pay=0,free=0;
      Array.prototype.forEach.call(cardEl.querySelectorAll('[data-on]'),function(cb){
        if(cb.checked){var mid=cb.getAttribute('data-on');var m=members.filter(function(x){return x.memberId===mid;})[0]||{};

      });
      var per=pay?fare/pay:0;

    }

      Array.prototype.forEach.call(cardEl.querySelectorAll('[data-free]'),function(fb){fb.onchange=function(){refresh(ti);};});

          if(cb.checked){var mid=cb.getAttribute('data-on');var m=members.filter(function(x){return x.memberId===mid;})[0]||{};

        var from=g('from'),to=g('to');
        var route=(from&&to)?(from+' → '+to):(tk0.route||'');
        var train=g('trainNo')?(g('trainNo')+(route?' · '+route:'')):(tk0.train||route);
        var tObj={mode:mode,pnr:g('pnr'),train:train,trainNo:g('trainNo')||tk0.trainNo||'',airline:g('airline')||tk0.airline||'',flightNo:g('flightNo')||tk0.flightNo||'',route:route,from:from||tk0.from||'',to:to||tk0.to||'',cls:g('cls')||tk0.cls||'',date:g('date'),fare:fare,payerId:g('payer'),fileId:g('fileId'),lines:lines,passengers:passengers};
        tickets.push(tObj);

        if(mode!=='flight'){[from,to].forEach(function(s){ s=String(s||'').trim(); if(s.length>=2 && !allStations().some(function(x){return x.toLowerCase()===s.toLowerCase();})){ call('api_addStation',{token:S.token,name:s}).then(function(r){if(r&&r.stations)S.customStations=r.stations;}).catch(function(){}); } });}
      });
      if(bad)return toast('Total fare aur kam se kam ek paying person chuno');
      loading(true);
      Promise.all(pdfReads).then(function(){
        if(editId){
          call('api_editTicket',{token:S.token,tripId:S.trip.tripId,expenseId:editId,ticket:tickets[0]}).then(function(d){loading(false);closeModal();setData(d);openTripTickets();toast('Ticket updated');}).catch(function(e){loading(false);toast(e);});
        } else {
          call('api_addTicketExpenses',{token:S.token,tripId:S.trip.tripId,tickets:tickets}).then(function(d){loading(false);closeModal();setData(d);openTripTickets();toast('Ticket added');}).catch(function(e){loading(false);toast(e);});
        }
      });
    };
  });
}

function monthToInput(label){ // "November 2026" -> "2026-11"
  if(!label)return '';
  var mn=['january','february','march','april','may','june','july','august','september','october','november','december'];
  var m=String(label).toLowerCase().match(/([a-z]+)\s+(\d{4})/); if(!m)return '';
  var i=mn.indexOf(m[1]); if(i<0)return ''; return m[2]+'-'+('0'+(i+1)).slice(-2);
}

      var name=$('#euName').value.trim(); if(!name)return toast('Enter a name');
      loading(true);
      call('api_adminUpdateUser',{token:S.token,userId:u.userId,fullName:name,username:$('#euUser').value.trim(),mobile:$('#euPhone').value.trim(),email:$('#euEmail').value.trim(),dob:$('#euDob').value,isAdmin:$('#euAdmin').checked})
        .then(function(){loading(false);closeModal();openAdmin();toast('Saved');}).catch(function(e){loading(false);toast(e);});
    };
  });
}
function openCreatePlaceholder(tripId){
  var html='<p class="muted">For someone on the trip who hasn\'t made an account yet. Fill whatever you know — only the name is needed. When they sign up later with the same username or phone, their account connects to this one automatically.</p>\
    <div class="field"><label>Full name</label><input id="cpName" placeholder="Their full name"></div>\
    <div class="field"><label>Username (optional)</label><input id="cpUser" autocapitalize="none" placeholder="auto if blank"></div>\
    <div class="field"><label>Phone (optional)</label><input id="cpPhone" inputmode="tel" placeholder="for auto-connect"></div>\
    <div class="field"><label>Email (optional)</label><input id="cpEmail" autocapitalize="none" placeholder=""></div>\
    <div class="field"><label>Date of birth (optional)</label><input id="cpDob" type="date"></div>\
    <button class="btn" id="cpSave">Create</button>';
  sheetModal('Create placeholder person',html,function(){
    $('#cpSave').onclick=function(){
      var name=$('#cpName').value.trim(); if(!name)return toast('Enter a name');
      var arg={token:S.token,fullName:name,username:$('#cpUser').value.trim(),mobile:$('#cpPhone').value.trim(),email:$('#cpEmail').value.trim(),dob:$('#cpDob').value};
      if(tripId)arg.tripId=tripId;
      loading(true);
      call('api_adminCreatePlaceholder',arg).then(function(dd){loading(false);closeModal();if(tripId){setData(dd);openPeople();}else{openAdmin();}toast('Created');}).catch(function(e){loading(false);toast(e);});
    };
  });
}

/* ---------- bottom-sheet modal ---------- */
function sheetModal(title,innerHtml,after){
  var m=el('<div class="sheet"><div class="inner"><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><h3 style="flex:1;margin:0">'+esc(title)+'</h3><button class="iconbtn" id="closeSheet">✕</button></div><div id="sheetBody"></div></div></div>');
  $('#modal').innerHTML='';$('#modal').appendChild(m);$('#sheetBody').innerHTML=innerHtml;
  $('#closeSheet').onclick=closeModal;m.onclick=function(e){if(e.target===m)closeModal();};
  if(after)after();
}
</script>
